<svg width="220" height="150" viewBox="0 0 220 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Neon Glow -->
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Neon Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F8CFF"/>
      <stop offset="50%" stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#9A6BFF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="220" height="150" rx="22" fill="#0A0F1F"/>

  <!-- Snake body -->
  <path d="M30 100
           C60 55, 100 55, 130 80
           C160 105, 185 95, 200 60"
        stroke="url(#neonGrad)"
        stroke-width="14"
        fill="none"
        stroke-linecap="round"
        filter="url(#neonGlow)"/>

  <!-- Snake head -->
  <circle cx="200" cy="60" r="14" fill="#6C63FF" filter="url(#neonGlow)"/>

  <!-- Eyes -->
  <circle cx="195" cy="57" r="2.5" fill="#ffffff"/>
  <circle cx="205" cy="57" r="2.5" fill="#ffffff"/>

  <!-- Tongue -->
  <path d="M200 68 L200 78 L194 82"
        stroke="#FF3B3B"
        stroke-width="2.5"
        fill="none"
        filter="url(#neonGlow)"/>

  <!-- Neon highlight -->
  <circle cx="120" cy="80" r="12" fill="#ffffff" opacity="0.12"/>
</svg>

