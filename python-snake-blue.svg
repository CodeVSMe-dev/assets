<svg width="200" height="140" viewBox="0 0 200 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="snakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A7BFF"/>
      <stop offset="100%" stop-color="#6C63FF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="140" rx="22" fill="#0F172A"/>

  <!-- Snake body -->
  <path d="M30 95
           C55 60, 90 60, 115 80
           C140 100, 165 90, 175 65"
        stroke="url(#snakeGrad)"
        stroke-width="12"
        fill="none"
        stroke-linecap="round"/>

  <!-- Snake head -->
  <circle cx="175" cy="65" r="12" fill="#6C63FF"/>

  <!-- Eyes -->
  <circle cx="171" cy="62" r="2" fill="#fff"/>
  <circle cx="179" cy="62" r="2" fill="#fff"/>

  <!-- Tongue -->
  <path d="M175 72 L175 80 L170 83"
        stroke="#FF4B4B"
        stroke-width="2"
        fill="none"/>

  <!-- Glow -->
  <circle cx="110" cy="80" r="10" fill="#fff" opacity="0.12"/>
</svg>



  <!-- Small highlight -->
  <circle cx="88" cy="78" r="4" fill="#FFFFFF" opacity="0.15"/>
</svg>
