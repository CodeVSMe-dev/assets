<svg width="200" height="140" viewBox="0 0 200 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="snakeBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A7BFF"/>
      <stop offset="100%" stop-color="#6C63FF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="200" height="140" rx="24" fill="#020617"/>

  <!-- Snake body -->
  <path id="snake"
        d="M 20 90
           C 40 60, 70 60, 90 80
           C 110 100, 140 100, 160 80
           C 175 65, 185 50, 180 35"
        fill="none"
        stroke="url(#snakeBody)"
        stroke-width="10"
        stroke-linecap="round"/>

  <!-- Snake head -->
  <circle id="head" cx="180" cy="35" r="9" fill="#6C63FF"/>

  <!-- Eyes -->
  <circle cx="177" cy="33" r="1.6" fill="#FFFFFF"/>
  <circle cx="183" cy="33" r="1.6" fill="#FFFFFF"/>

  <!-- Tongue -->
  <path d="M180 39 L180 45 L176 47"
        stroke="#FF4B4B"
        stroke-width="2"
        fill="none"/>

  <!-- Soft glow -->
  <circle cx="120" cy="80" r="10" fill="#FFFFFF" opacity="0.12"/>

  <!-- Animation: subtle breathing / movement -->
  <animate
    xlink:href="#snake"
    attributeName="d"
    dur="3s"
    repeatCount="indefinite"
    values="
      M 20 90
      C 40 60, 70 60, 90 80
      C 110 100, 140 100, 160 80
      C 175 65, 185 50, 180 35;

      M 20 88
      C 40 58, 70 62, 90 82
      C 110 102, 140 98, 160 78
      C 175 63, 185 48, 180 33;

      M 20 90
      C 40 60, 70 60, 90 80
      C 110 100, 140 100, 160 80
      C 175 65, 185 50, 180 35;
    "/>

  <animate
    xlink:href="#head"
    attributeName="cy"
    dur="3s"
    repeatCount="indefinite"
    values="35;33;35"/>
</svg>


  <!-- Small highlight -->
  <circle cx="88" cy="78" r="4" fill="#FFFFFF" opacity="0.15"/>
</svg>
