<svg width="160" height="160" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="snakeBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A7BFF"/>
      <stop offset="100%" stop-color="#6C63FF"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="80" cy="80" r="70" fill="#0F172A"/>

  <!-- Snake body -->
  <path d="M40 110
           C 30 90, 35 70, 50 60
           C 70 50, 90 55, 100 70
           C 110 85, 115 100, 110 115
           C 105 130, 90 135, 75 130
           C 60 125, 55 120, 50 115
           Z"
        fill="url(#snakeBody)" />

  <!-- Snake head -->
  <circle cx="50" cy="60" r="12" fill="#6C63FF"/>

  <!-- Eyes -->
  <circle cx="46" cy="58" r="2" fill="#FFFFFF"/>
  <circle cx="54" cy="58" r="2" fill="#FFFFFF"/>

  <!-- Tongue -->
  <path d="M50 66 L50 74 L46 78" stroke="#FF4B4B" stroke-width="2" fill="none" />

  <!-- Small highlight -->
  <circle cx="88" cy="78" r="4" fill="#FFFFFF" opacity="0.15"/>
</svg>
