<svg width="240" height="160" viewBox="0 0 240 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Neon Glow -->
    <filter id="pixelGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Neon Gradient -->
    <linearGradient id="pixelNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F8CFF"/>
      <stop offset="50%" stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#9A6BFF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="240" height="160" rx="20" fill="#0A0F1F"/>

  <!-- Pixel snake body -->
  <path d="
    M30 110
    L50 90
    L70 100
    L90 80
    L110 95
    L130 75
    L150 90
    L170 70
    L190 85
    L210 60
  "
  stroke="url(#pixelNeon)"
  stroke-width="14"
  stroke-linecap="square"
  fill="none"
  filter="url(#pixelGlow)"/>

  <!-- Pixel head -->
  <rect x="205" y="50" width="20" height="20" fill="#6C63FF" filter="url(#pixelGlow)"/>

  <!-- Eyes -->
  <rect x="208" y="53" width="4" height="4" fill="#ffffff"/>
  <rect x="216" y="53" width="4" height="4" fill="#ffffff"/>

  <!-- Tongue -->
  <rect x="212" y="70" width="3" height="10" fill="#FF3B3B" filter="url(#pixelGlow)"/>
</svg>

